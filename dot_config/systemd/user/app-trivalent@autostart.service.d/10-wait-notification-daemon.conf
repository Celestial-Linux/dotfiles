# Chromium probes org.freedesktop.Notifications once at browser startup; if
# the daemon (caelestia shell) isn't registered on the bus yet, it falls back
# to drawing its own notification windows for the whole session. Wait for the
# name before launching; "-" keeps Trivalent starting even if the wait times out.
[Service]
ExecStartPre=-/usr/bin/gdbus wait --session --timeout 30 org.freedesktop.Notifications
