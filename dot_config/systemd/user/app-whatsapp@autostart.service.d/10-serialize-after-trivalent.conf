# WhatsApp Web runs as a PWA in trivalent's Default profile, so it shares
# ~/.config/trivalent (SingletonLock + leveldb databases) with the main
# browser. Cold-starting both concurrently races for those locks and one loses
# with "profile appears to be in use" / a locked database. Order this after
# trivalent and wait until trivalent owns the profile singleton so this launch
# becomes a clean hand-off (open an app window in the running browser) instead
# of a competing cold start.
[Unit]
After=app-trivalent@autostart.service

[Service]
# Poll (max 5s) for trivalent's singleton socket; "-" launches anyway on
# timeout. $$ escapes to a literal $ for the shell; %h is the home directory.
ExecStartPre=-/usr/bin/bash -c 'for i in $$(seq 1 50); do [ -S "$$(readlink -f %h/.config/trivalent/SingletonSocket)" ] && exit 0; sleep 0.1; done'
