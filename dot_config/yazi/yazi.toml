[mgr]
linemode = "size_and_mtime"

[open]
prepend_rules = [
	{ url = "*.json", use = "edit" },
	{ url = "*.html", use = [ "open", "edit" ] },
	{ url = "*.png", use = [ "open", "edit-image" ] },
	{ url = "*.jpg", use = [ "open", "edit-image" ] },
]

[opener]
play = [
	{ run = 'mpv %s', orphan = true, desc = "Play Media" }
]
edit-image = [
	{ run = 'flatpak run org.gimp.GIMP %s', orphan = true, desc = "Edit Image" }
]
edit = [
	{ run = '$EDITOR %s', block = true },
]
open = [
	{ run = 'xdg-open %s1', orphan = true, desc = "Open" },
]
