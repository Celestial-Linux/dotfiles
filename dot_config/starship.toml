# ──────────────────────────────────────────────────────────────
# Starship — Sakura Parfait
# ──────────────────────────────────────────────────────────────

palette = "sakura_parfait"

format = """
[](fg:strawberry)\
$os\
$username\
[](fg:strawberry bg:lavender)\
$hostname\
[](fg:lavender bg:baby_blue)\
$directory\
[](fg:baby_blue bg:peach)\
$git_branch\
$git_status\
[](fg:peach bg:mint)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:mint bg:butter)\
$docker_context\
[](fg:butter bg:periwinkle)\
$time
"""

# Keep the prompt compact.
# Uncomment if you currently get an unwanted blank line.
# add_newline = false


# ──────────────────────────────────────────────────────────────
# Palette
# ──────────────────────────────────────────────────────────────

[palettes.sakura_parfait]

# Main Powerline colors
strawberry = "#F4A7BB"
lavender   = "#C6B4E3"
baby_blue  = "#AFCBEA"
peach      = "#F6C1A7"
mint       = "#A8D8C9"
butter     = "#F5DDA9"
periwinkle = "#9FAFE0"

# Foregrounds / semantic colors
ink        = "#34364A"
soft_white = "#FFF8FA"
muted      = "#74768A"

success    = "#87C5A4"
warning    = "#E8B86D"
danger     = "#E8899A"


# ──────────────────────────────────────────────────────────────
# User
# ──────────────────────────────────────────────────────────────

[username]
show_always = true
style_user = "bg:strawberry fg:ink"
style_root = "bg:strawberry fg:ink"

# Your Among Us glyph moved here from the clock.
format = '[$user  ]($style)'

disabled = false


# ──────────────────────────────────────────────────────────────
# Host
# ──────────────────────────────────────────────────────────────

[hostname]
ssh_only = false
style = "bg:lavender fg:ink"
format = '[ 󰒋 $hostname ]($style)'
trim_at = "."
disabled = false


# ──────────────────────────────────────────────────────────────
# Operating System
# ──────────────────────────────────────────────────────────────

[os]
style = "bg:strawberry fg:ink"
format = '[ $symbol ]($style)'
disabled = false

[os.symbols]
Alpaquita = ""
Alpine = ""
AlmaLinux = ""
Amazon = ""
Android = ""
Arch = ""
Artix = ""
CachyOS = ""
CentOS = ""
Debian = ""
DragonFly = ""
Emscripten = ""
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = "󰛓"
Gentoo = ""
HardenedBSD = "󰞌"
Illumos = "󰈸"
Kali = ""
Linux = ""
Mabox = ""
Macos = ""
Manjaro = ""
Mariner = ""
MidnightBSD = ""
Mint = ""
NetBSD = ""
NixOS = ""
Nobara = ""
OpenBSD = "󰈺"
openSUSE = ""
OracleLinux = "󰌷"
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
RockyLinux = ""
Redox = "󰀘"
Solus = "󰠳"
SUSE = ""
Ubuntu = ""
Unknown = ""
Void = ""
Windows = "󰍲"


# ──────────────────────────────────────────────────────────────
# Directory
# ──────────────────────────────────────────────────────────────

[directory]
style = "bg:baby_blue fg:ink"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""


# ──────────────────────────────────────────────────────────────
# Git
# ──────────────────────────────────────────────────────────────

[git_branch]
symbol = ""
style = "bg:peach fg:ink"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:peach fg:ink"
format = '[$all_status$ahead_behind ]($style)'


# ──────────────────────────────────────────────────────────────
# Languages
# ──────────────────────────────────────────────────────────────

[c]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[elixir]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥"
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = ""
style = "bg:mint fg:ink"
format = '[ $symbol ($version) ]($style)'


# ──────────────────────────────────────────────────────────────
# Docker
# ──────────────────────────────────────────────────────────────

[docker_context]
symbol = ""
style = "bg:butter fg:ink"
format = '[ $symbol $context ]($style)'


# ──────────────────────────────────────────────────────────────
# Time
# ──────────────────────────────────────────────────────────────

[time]
disabled = false
time_format = "%R"
style = "bg:periwinkle fg:ink"
format = '[ 󰥔 $time ]($style)'


# ──────────────────────────────────────────────────────────────
# Character
# ──────────────────────────────────────────────────────────────

[character]
success_symbol = "[➜](bold fg:strawberry)"
error_symbol = "[➜](bold fg:danger)"
vicmd_symbol = "[N](bold fg:butter)"
